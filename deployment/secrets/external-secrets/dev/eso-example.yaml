apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: eso-example
  namespace: platform
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    name: replace-with-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: example-runtime-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: replace-with-secret-manager-key
