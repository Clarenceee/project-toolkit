fullnameOverride: platform-example

deployment:
  enabled: true
  replicas: 1
  container:
    name: platform-example
    image: example.invalid/platform-example:replace-me
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi
    env:
      - name: LOG_LEVEL
        value: INFO

serviceAccount:
  create: true
  name: platform-example
