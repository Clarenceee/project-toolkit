[project]
name = "project-toolkit"
version = "0.2.0"
description = "Reusable modules for Python projects."
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.7,<3",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
agents = ["pydantic-ai>=1,<2"]
evaluation = ["openai>=2,<3"]
mlflow = ["mlflow>=3,<4"]
airflow = [
    "apache-airflow>=2.10,<3",
    "apache-airflow-providers-cncf-kubernetes>=8,<10",
    "kubernetes>=28,<32",
]
metaflow = ["metaflow>=2.12,<3"]
drift = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scipy>=1.12,<2",
]
migrations = [
    "SQLAlchemy>=1.4.49,<2",
    "alembic>=1.13,<2",
    "psycopg2-binary>=2.9,<3",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reusable_helpers"]

[dependency-groups]
dev = [
    "black>=25,<26",
    "ruff>=0.12,<0.13",
    "mypy>=1.16,<2",
    "bandit[toml]>=1.8,<2",
]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.11"
files = ["reusable_helpers", "scripts", "examples"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
namespace_packages = true
explicit_package_bases = true

[tool.bandit]
targets = ["reusable_helpers", "scripts", "examples"]
exclude_dirs = ["tests", ".venv"]
